version: '3.9'

services:
  redis:
    image: redis:7-alpine
    command: ['redis-server', '/usr/local/etc/redis/redis.conf']
    environment:
      # redis-cli picks this up automatically — keeps the password out of the
      # healthcheck command line (and out of `docker inspect`'s process args).
      REDISCLI_AUTH: ${REDIS_PW}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - rooted

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rooted

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '3001:3001'
    env_file:
      - ./apps/api/.env
    environment:
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: ${REDIS_URL}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/health']
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - rooted
      - shared

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ''
        VITE_APP_DOMAIN: ${APP_DOMAIN:-rooted.app}
    ports:
      - '5173:80'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - rooted

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web
    networks:
      - rooted

volumes:
  redis_data:
  minio_data:

networks:
  rooted:
    driver: bridge
  # Mongo lives outside this project (~/Desktop/rooted-mongo-shared) so both
  # rooted-prod and rooted-uat checkouts can share it without either owning
  # its lifecycle. Create it once on the host: `docker network create rooted-shared-net`.
  shared:
    external: true
    name: rooted-shared-net
