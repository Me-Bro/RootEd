events {
  worker_connections 1024;
}

http {
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

  upstream api {
    server api:3001;
  }

  upstream rooted {
    server rooted:80;
  }

  upstream catalyst {
    server catalyst:80;
  }

  # The visitor's address for the portal: Cloudflare's header, else this
  # connection's own. Always sent as X-Real-IP so a browser-supplied one never
  # gets through to the portal's nginx.
  map $http_cf_connecting_ip $catalyst_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
  }

  # HTTP only — TLS terminates at the Cloudflare edge, cloudflared forwards
  # plain HTTP over localhost (see systemd unit cloudflared-rooted.service).
  # Tenants are <tenant>-rooted.ruralrootcloud.com (flat, single-level
  # subdomain — see docker-compose.tunnel.yml for why).
  # RR Cloud Career Catalyst portal (apps/catalyst). An exact server_name beats the
  # *.ruralrootcloud.com wildcard below whatever the order, so these two hosts
  # never reach the tenant vhost. The portal container's own nginx serves the SPA
  # and proxies /__api/ to the api with the portal host pinned.
  server {
    listen 80;
    server_name catalyst.ruralrootcloud.com catalyst-uat.ruralrootcloud.com;

    location / {
      proxy_pass http://catalyst;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $catalyst_client_ip;
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 80;
    server_name *.ruralrootcloud.com rooted.ranabrothers.online rooted-uat.ranabrothers.online;

    # Auth endpoints — tighter rate limit
    location /auth/login {
      limit_req zone=login_limit burst=5 nodelay;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location /api/ {
      limit_req zone=api_limit burst=50 nodelay;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA (web container's own nginx proxies /__api/ to the api service)
    location / {
      proxy_pass http://rooted;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
