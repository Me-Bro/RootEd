events {
  worker_connections 1024;
}

http {
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

  upstream api {
    server api:3001;
  }

  upstream web {
    server web:80;
  }

  # HTTP only — TLS terminates at the Cloudflare edge, cloudflared forwards
  # plain HTTP over localhost (see systemd unit cloudflared-rooted.service).
  # Tenants are <tenant>-rooted.ruralrootcloud.com (flat, single-level
  # subdomain — see docker-compose.tunnel.yml for why).
  server {
    listen 80;
    server_name *.ruralrootcloud.com;

    # Auth endpoints — tighter rate limit
    location /auth/login {
      limit_req zone=login_limit burst=5 nodelay;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location /api/ {
      limit_req zone=api_limit burst=50 nodelay;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA (web container's own nginx proxies /__api/ to the api service)
    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
