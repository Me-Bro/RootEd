name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]

    services:
      mongodb:
        image: mongo:7
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter ${{ matrix.app }} lint

      - name: Test
        run: pnpm --filter ${{ matrix.app }} test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/rooted_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test-access-secret-at-least-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-chars
          MASTER_ENCRYPTION_KEY: test-master-encryption-key-32-chars
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: test
          S3_SECRET_KEY: test

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Not service containers: apps/api/.env.test points MONGODB_URI at
      # ?replicaSet=rs0, because tenant provisioning runs in a transaction and
      # transactions need a replica set. A `services:` block cannot override the
      # image command to pass --replSet, so Mongo comes up here instead.
      - name: Start Mongo as a single-node replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval 'db.adminCommand("ping")' && break
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)' && break
            sleep 2
          done

      - name: Start Redis
        run: docker run -d --name redis -p 6379:6379 redis:7-alpine

      # The expense-with-attachment spec uploads a file. The API calls
      # ensureBucket() on boot, so no bucket step is needed here.
      - name: Start Minio
        run: |
          docker run -d --name minio -p 9000:9000             -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin             minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Seed the test database
        run: pnpm --filter api seed:test:clean

      - name: Start the API
        run: |
          node --env-file=apps/api/.env.test apps/api/src/index.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf -H 'Host: testschool.localhost' http://localhost:3001/csrf-token && break
            sleep 2
          done
          curl -sf -H 'Host: testschool.localhost' http://localhost:3001/csrf-token > /dev/null

      # No `|| true`. This is the suite that catches regressions the unit tests
      # cannot see — an unenforced browser suite is how 20 failures accumulated
      # on main unnoticed.
      - name: Run Playwright e2e
        run: pnpm --filter web test:e2e

      - name: Run axe accessibility check
        if: always()
        run: pnpm --filter web exec playwright test --project=axe

      - name: API log
        if: failure()
        run: tail -100 /tmp/api.log

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    # Also gated on e2e: pushing images to GHCR is a release step, and a red
    # browser suite is exactly the signal that should stop one.
    needs: [lint-and-test, e2e]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }},ghcr.io/${{ github.repository }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ github.sha }},ghcr.io/${{ github.repository }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lighthouse:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm --filter web build
      - name: Run Lighthouse CI
        run: pnpm --filter web exec lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    environment: staging

    steps:
      - name: Deploy to staging
        run: echo "Deploy ${{ github.sha }} to staging — wire up your deploy script here"
