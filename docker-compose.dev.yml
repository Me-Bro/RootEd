version: '3.9'

# Full dev stack with hot reload.
# Access: API http://localhost:3001  |  Web http://localhost:5173  |  Minio console http://localhost:9001
# Start: docker compose -f docker-compose.dev.yml up
# node --watch reloads API on file change; Vite HMR reloads frontend instantly.

services:
  api:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install -g pnpm@11.1.2 && pnpm install --ignore-scripts && pnpm --filter api rebuild argon2 msgpackr-extract && pnpm dev:api"
    ports:
      - '3001:3001'
    env_file:
      - ./apps/api/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/eduflow?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      NODE_ENV: development
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - api_app_node_modules:/app/apps/api/node_modules
      - shared_node_modules:/app/packages/shared/node_modules
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    networks:
      - eduflow

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install -g pnpm@11.1.2 && pnpm install --ignore-scripts && pnpm dev:web"
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_APP_DOMAIN: eduflow.app
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_app_node_modules:/app/apps/web/node_modules
      - shared_node_modules:/app/packages/shared/node_modules
    depends_on:
      - api
    networks:
      - eduflow

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    networks:
      - eduflow

  mongo:
    image: mongo:7
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eduflow

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    command: >
      mongosh --host mongo:27017 --eval
      "try { rs.status() } catch(e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }"
    networks:
      - eduflow

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - eduflow

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eduflow

volumes:
  mongo_data:
  redis_data:
  minio_data:
  api_node_modules:
  api_app_node_modules:
  shared_node_modules:
  web_node_modules:
  web_app_node_modules:

networks:
  eduflow:
    driver: bridge
