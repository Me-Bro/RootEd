server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy API calls same-origin so resolveTenant() sees the real subdomain Host
  # header and the refresh cookie stays first-party (see apps/rooted/src/lib/api.js).
  location /__api/ {
    proxy_pass http://api:3001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # pdf.js's worker (the report card preview) is a .mjs file. nginx's stock
  # mime.types has no mapping for it, so it would go out as octet-stream and the
  # browser would refuse to run it as a module worker.
  include /etc/nginx/mime.types;
  types {
    text/javascript mjs;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache static assets
  location ~* \.(m?js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
