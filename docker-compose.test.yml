version: '3.9'

# Override for E2E test environment.
# Usage: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d
#
# Changes from base:
#   - API uses rooted_test database (isolated from dev data)
#   - web + nginx excluded (Playwright drives Vite dev server locally)

services:
  api:
    environment:
      MONGODB_URI: ${MONGODB_URI_TEST}
      APP_DOMAIN: localhost
      NODE_ENV: development
    networks:
      - rooted
      - shared

  # Base pins a host-tagged image with pull_policy: never; a dev machine has
  # none, so build it from ops/minio on first use.
  minio:
    build: ./ops/minio
    pull_policy: missing

  # Disable web and nginx — Playwright drives the Vite dev server locally
  web:
    profiles:
      - disabled
  nginx:
    profiles:
      - disabled
